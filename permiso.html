<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>Micrófono para Capi</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #fffbeb; color: #0f172a; }
  .caja { background: #fff; border: 1px solid #fcd34d; border-radius: 16px; padding: 28px; max-width: 420px; text-align: center; }
  #robot svg { width: 84px; height: 78px; image-rendering: pixelated; }
  button { font: inherit; font-weight: 600; background: #b45309; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; margin-top: 10px; }
  #msg { margin-top: 12px; color: #92400e; }
</style></head>
<body><div class="caja">
  <div id="robot"></div>
  <h2>Deja que Capi te escuche</h2>
  <p>Chrome necesita tu permiso una sola vez para que Capi use el micrófono. Solo escucha mientras el panel está abierto y solo hace caso cuando dices “Capi, …”.</p>
  <button id="ok">Permitir micrófono</button>
  <div id="msg"></div>
</div>
<script src="robot.js"></script>
<script src="permiso.js"></script>
</body></html>
