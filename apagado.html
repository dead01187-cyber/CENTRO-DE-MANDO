<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>Robot apagado</title>
<link rel="stylesheet" href="tema.css">
<style>
  body { margin: 0; font: 14px/1.5 -apple-system, system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; text-align: center; }
  .caja { padding: 24px; max-width: 320px; }
  .robot svg { width: 96px; height: 90px; filter: grayscale(1); opacity: .55; }
  h1 { font-size: 18px; margin: 10px 0 4px; }
  p { color: #64748b; margin: 0 0 14px; }
  button { border: 0; border-radius: 999px; padding: 9px 18px; font: inherit; font-weight: 700; background: #16a34a; color: #fff; cursor: pointer; }
</style></head>
<body>
<div class="caja"><div class="robot" id="robot"></div><h1 id="titulo">Robot apagado</h1>
<p>Está apagado: no trabaja ni revisa nada solo. Lo que le llegue se queda en fila hasta que lo prendas.</p>
<button id="prender">Prender</button></div>
<script src="robot.js"></script>
<script src="apagado.js"></script>
</body></html>
