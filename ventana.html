<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ventana de trabajo</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #e2e8f0; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  .caja { text-align: center; max-width: 460px; padding: 24px; }
  .ico { font-size: 44px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p { color: #94a3b8; margin: 6px 0; }
  b { color: #fbbf24; }
</style>
</head>
<body>
  <div class="caja">
    <div class="ico" id="ico">🪟</div>
    <h1 id="titulo">Ventana de trabajo</h1>
    <p id="quienes"></p>
    <p>Aquí abren sus pestañas los agentes de este brazo, separadas de los otros brazos para que no choquen. <b>No cierres esta ventana</b> mientras trabajan (si la cierras, abren otra).</p>
  </div>
  <script src="ventana.js"></script>
</body>
</html>
